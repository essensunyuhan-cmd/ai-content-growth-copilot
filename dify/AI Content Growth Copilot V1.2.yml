            请输出：


            1. 当前最核心的用户问题

            2. 高频问题

            3. 核心痛点

            4. 典型使用场景

            5. 用户情绪

            6. 用户明确表达的需求

            7. AI推断出的潜在需求

            8. 潜在内容需求

            9. 每个重要判断对应的用户反馈证据


            不要生成任何具体内容选题。'
